name: build AR UY city catalogs

# Workflow intentionally disabled in the release branch. Catalog regeneration is
# performed manually with scripts/build-city-catalog.py when source data changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generator:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build-city-catalog.py
