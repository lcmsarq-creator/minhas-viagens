name: Export working tree v0142

on:
  push:
    branches:
      - feat/iconic-road-interactions-v0142
    paths:
      - '.github/workflows/export-working-tree-v0142.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/iconic-road-interactions-v0142
      - name: Archive working tree
        run: |
          rm -rf .git
          zip -qr working-tree.zip . -x 'working-tree.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: working-tree-v0142
          path: working-tree.zip
