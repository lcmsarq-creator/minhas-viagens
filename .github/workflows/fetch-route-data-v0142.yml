name: Fetch route data v0142

on:
  push:
    branches:
      - feat/iconic-road-interactions-v0142
    paths:
      - '.github/workflows/fetch-route-data-v0142.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Caminhos de Pedra access
        shell: bash
        run: |
          set -u
          mkdir out
          curl -Ls 'https://router.project-osrm.org/route/v1/driving/-51.383589,-29.181258;-51.44035,-29.17496?overview=full&geometries=geojson' -o out/caminhos-pedra-access-osrm.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caminhos-pedra-access-v0142
          path: out
