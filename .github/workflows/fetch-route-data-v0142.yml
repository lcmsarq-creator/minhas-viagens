name: Fetch route data v0142

on:
  push:
    branches:
      - feat/iconic-road-interactions-v0142
    paths:
      - '.github/workflows/fetch-route-data-v0142.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download final route sources
        shell: bash
        run: |
          set -u
          mkdir out
          curl -Ls 'https://router.project-osrm.org/route/v1/driving/-44.57693,-22.32587;-44.59703,-22.32449?overview=full&geometries=geojson' -o out/maringa-maromba-osrm.json || true
          curl -A 'MinhasViagens/0.14.2 route-review' -Ls 'https://api.openstreetmap.org/api/0.6/map?bbox=-51.54,-29.20,-51.42,-29.14' -o out/caminhos-pedra.osm || true
          curl -A 'MinhasViagens/0.14.2 route-review' -Ls 'https://api.openstreetmap.org/api/0.6/map?bbox=-52.42,-22.58,-52.14,-22.47' -o out/morro-diabo.osm || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-data-v0142-final
          path: out
