name: Fetch route data v0142

on:
  push:
    branches:
      - feat/iconic-road-interactions-v0142
    paths:
      - '.github/workflows/fetch-route-data-v0142.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download route sources
        shell: bash
        run: |
          set -u
          mkdir out
          for url in \
            'https://www.google.com/maps/d/kml?mid=1O8i88DP9OvSd4A-W6i9mBGjLc5C4eco&forcekml=1' \
            'https://www.google.com/maps/d/u/0/kml?mid=1O8i88DP9OvSd4A-W6i9mBGjLc5C4eco&forcekml=1' \
            'https://www.google.com/maps/d/u/0/viewer?mid=1O8i88DP9OvSd4A-W6i9mBGjLc5C4eco&usp=sharing'; do
            name="$(echo "$url" | sha256sum | cut -c1-8)"
            curl -A 'Mozilla/5.0' -Ls -w '\nHTTP=%{http_code}\nURL=%{url_effective}\n' "$url" -o "out/google-$name.body" 2>"out/google-$name.err" || true
          done
          cat > /tmp/ceu.query <<'EOF'
          [out:json][timeout:60];
          way["highway"](-20.427,-46.634,-20.375,-46.553);
          (._;>;);
          out body;
          EOF
          curl -fLs --data-urlencode data@/tmp/ceu.query 'https://overpass-api.de/api/interpreter' -o out/canastra-network.json || \
          curl -fLs --data-urlencode data@/tmp/ceu.query 'https://overpass.kumi.systems/api/interpreter' -o out/canastra-network.json
          curl -fLs 'https://router.project-osrm.org/route/v1/driving/-36.49759445,-10.44154807;-36.46776551,-10.48157729?overview=full&geometries=geojson' -o out/brejo-grande-osrm.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-data-v0142-2
          path: out
