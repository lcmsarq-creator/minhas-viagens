name: Validar preview integral do catálogo icônico

on:
  push:
    branches:
      - feat/iconic-catalog-full-preview
    paths:
      - "scripts/apply_iconic_catalog_full_preview.py"
      - ".github/workflows/iconic-catalog-full-preview.yml"

permissions:
  contents: write

concurrency:
  group: iconic-catalog-full-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar comportamento do catálogo
        run: python scripts/apply_iconic_catalog_full_preview.py

      - name: Validar JavaScript
        run: |
          node --check iconic-catalog-preview-hotfix.js
          node --check iconic-routes.js
          node --test tests/iconic-routes.test.js tests/iconic-routes-ui.test.js tests/iconic-catalog-preview-hotfix.test.js

      - name: Publicar alteração na branch
        run: |
          git config user.name "minhas-viagens-route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add \
            auth.js \
            index.html \
            iconic-routes.js \
            iconic-catalog-preview-hotfix.js \
            tests/iconic-catalog-preview-hotfix.test.js
          if git diff --cached --quiet; then
            echo "Preview integral já está atualizado."
          else
            git commit -m "feat: abrir rotas integrais no catálogo icônico"
            git push origin HEAD:${{ github.ref_name }}
          fi
