name: Validar acesso imediato às rotas icônicas

on:
  push:
    branches:
      - fix/iconic-route-instant-access-v2
    paths:
      - 'iconic-catalog-preview-hotfix.js'
      - 'tests/iconic-catalog-preview-hotfix.test.js'
      - '.github/workflows/iconic-instant-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: fix/iconic-route-instant-access-v2
          fetch-depth: 0

      - name: Atualizar cache-bust para v0.13.17
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'auth.js', 'iconic-routes.js', 'iconic-route-catalog.js']:
              path = Path(name)
              text = path.read_text()
              text = text.replace('0.13.16', '0.13.17')
              path.write_text(text)
          PY

      - name: Validar JavaScript
        run: |
          node --check iconic-catalog-preview-hotfix.js
          node --check iconic-route-catalog.js
          node --check iconic-routes.js
          node --check auth.js

      - name: Rodar testes
        run: |
          node --test tests/iconic-catalog-preview-hotfix.test.js tests/iconic-route-catalog.test.js tests/iconic-routes-ui.test.js

      - name: Publicar versionamento na branch
        run: |
          if git diff --quiet -- index.html auth.js iconic-routes.js iconic-route-catalog.js; then exit 0; fi
          git config user.name "minhas-viagens-route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add index.html auth.js iconic-routes.js iconic-route-catalog.js
          git commit -m "chore: publicar correção icônica v0.13.17"
          git push origin HEAD:fix/iconic-route-instant-access-v2
