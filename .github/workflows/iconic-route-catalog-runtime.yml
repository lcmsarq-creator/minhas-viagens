name: Validar runtime do catálogo icônico hospedado

on:
  push:
    branches:
      - feat/iconic-route-hosted-catalog
    paths:
      - 'iconic-route-catalog.js'
      - 'iconic-catalog-preview-hotfix.js'
      - 'auth.js'
      - 'index.html'
      - 'iconic-routes.js'
      - 'tests/iconic-route-catalog.test.js'
      - 'tests/iconic-catalog-preview-hotfix.test.js'
      - '.github/workflows/iconic-route-catalog-runtime.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: feat/iconic-route-hosted-catalog
          fetch-depth: 0

      - name: Atualizar shell para v0.13.16
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text()
          text = text.replace('MINHAS_VIAGENS_APP_VERSION = "0.13.15"', 'MINHAS_VIAGENS_APP_VERSION = "0.13.16"')
          text = text.replace('config.js?v=0.13.15', 'config.js?v=0.13.16')
          text = text.replace('auth.js?v=0.13.15', 'auth.js?v=0.13.16')
          text = text.replace('· v0.13.13', '· v0.13.16')
          index.write_text(text)

          iconic = Path('iconic-routes.js')
          iconic.write_text(iconic.read_text().replace('const APP_VERSION = "0.13.15";', 'const APP_VERSION = "0.13.16";'))
          PY

      - name: Validar JavaScript
        run: |
          node --check iconic-route-catalog.js
          node --check iconic-catalog-preview-hotfix.js
          node --check iconic-routes.js
          node --check auth.js

      - name: Validar catálogo e interface
        run: |
          node --test tests/iconic-route-catalog.test.js tests/iconic-catalog-preview-hotfix.test.js tests/iconic-routes-ui.test.js

      - name: Publicar versionamento na branch
        run: |
          if git diff --quiet -- index.html iconic-routes.js; then exit 0; fi
          git config user.name "minhas-viagens-route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add index.html iconic-routes.js
          git commit -m "chore: publicar catálogo icônico hospedado v0.13.16"
          git push origin HEAD:feat/iconic-route-hosted-catalog
