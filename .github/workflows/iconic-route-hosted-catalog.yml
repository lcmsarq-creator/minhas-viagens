name: Gerar catálogo hospedado de rotas icônicas

on:
  push:
    branches:
      - feat/iconic-route-hosted-catalog
    paths:
      - 'scripts/build_iconic_route_catalog.py'
      - '.github/workflows/iconic-route-hosted-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: feat/iconic-route-hosted-catalog
          fetch-depth: 0

      - name: Gerar catálogo compacto
        run: python scripts/build_iconic_route_catalog.py

      - name: Validar catálogo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('iconic-route-catalog/v1')
          manifest = json.loads((root / 'manifest.json').read_text())
          bundle = json.loads((root / 'bundle.json').read_text())
          assert manifest['schema'] == 'iconic-route-preview-manifest-v1'
          assert bundle['schema'] == 'iconic-route-preview-bundle-v1'
          assert manifest['routeCount'] == 44, manifest['routeCount']
          assert bundle['routeCount'] == manifest['routeCount']
          assert set(bundle['routes']) == set(manifest['routes'])
          missing = [rid for rid in manifest['routes'] if not (root / manifest['routes'][rid]['path']).exists()]
          assert not missing, missing
          assert (root / 'bundle.json').stat().st_size < 2_000_000
          print('Catálogo validado:', manifest['routeCount'], 'rotas')
          print('Bundle bytes:', (root / 'bundle.json').stat().st_size)
          PY

      - name: Publicar catálogo na branch
        run: |
          if git diff --quiet -- iconic-route-catalog/v1; then exit 0; fi
          git config user.name "minhas-viagens-route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add iconic-route-catalog/v1
          git commit -m "data: hospedar geometrias compactas das rotas icônicas"
          git push origin HEAD:feat/iconic-route-hosted-catalog
