name: Validar escopo real do preview icônico

on:
  push:
    branches:
      - fix/iconic-preview-runtime-scope

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: fix/iconic-preview-runtime-scope
          fetch-depth: 0

      - name: Atualizar cache-bust para v0.13.18
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('index.html'),
              Path('auth.js'),
              Path('iconic-routes.js'),
              Path('iconic-route-catalog.js'),
              Path('iconic-catalog-preview-hotfix.js'),
          ]
          for path in files:
              text = path.read_text()
              text = text.replace('0.13.17', '0.13.18')
              path.write_text(text)
          PY

      - name: Validar JavaScript
        run: |
          node --check iconic-catalog-preview-hotfix.js
          node --check iconic-route-catalog.js
          node --check iconic-routes.js
          node --check auth.js

      - name: Rodar testes relevantes
        run: |
          node --test tests/iconic-catalog-preview-hotfix.test.js tests/iconic-route-catalog.test.js tests/iconic-routes-ui.test.js

      - name: Validar que o bug de escopo foi removido
        run: |
          grep -q 'typeof map !== "undefined" ? map : null' iconic-catalog-preview-hotfix.js
          grep -q 'typeof state !== "undefined" ? state : null' iconic-catalog-preview-hotfix.js
          grep -q 'typeof els !== "undefined" ? els : null' iconic-catalog-preview-hotfix.js
          ! grep -q '!window.map' iconic-catalog-preview-hotfix.js
          ! grep -q 'window.state?.iconicPreviewLayer' iconic-catalog-preview-hotfix.js
          ! grep -q 'window.els?.iconicOtherList' iconic-catalog-preview-hotfix.js

      - name: Publicar versionamento na branch
        run: |
          if git diff --quiet -- index.html auth.js iconic-routes.js iconic-route-catalog.js iconic-catalog-preview-hotfix.js; then exit 0; fi
          git config user.name "minhas-viagens-route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add index.html auth.js iconic-routes.js iconic-route-catalog.js iconic-catalog-preview-hotfix.js
          git commit -m "chore: publicar correção de runtime v0.13.18"
          git push origin HEAD:fix/iconic-preview-runtime-scope
