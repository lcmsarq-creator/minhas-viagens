name: Validar preload móvel de rotas icônicas

on:
  push:
    paths:
      - '.github/workflows/mobile-iconic-preload.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-iconic-preload
          fetch-depth: 0

      - name: Atualizar versão do shell
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ('index.html', 'auth.js', 'iconic-routes.js'):
              path = Path(filename)
              text = path.read_text()
              text = text.replace('0.13.14', '0.13.15')
              path.write_text(text)
          PY

      - name: Validar JavaScript e testes
        run: |
          node --check iconic-catalog-preview-hotfix.js
          node --check iconic-routes.js
          node --check auth.js
          node --test tests/iconic-catalog-preview-hotfix.test.js tests/iconic-routes-ui.test.js

      - name: Publicar ajustes na branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "minhas-viagens-route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add index.html auth.js iconic-routes.js
          git commit -m "fix: antecipar preload icônico no celular"
          git push origin HEAD:fix/mobile-iconic-preload
