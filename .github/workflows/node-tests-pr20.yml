name: Testes Node PR 20

on:
  push:
    branches:
      - feat/central-north-america-road-shields
    paths:
      - ".github/workflows/node-tests-pr20.yml"
      - "**/*.js"
      - "**/*.svg"
      - "**/*.html"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Executar suíte Node
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js 2>&1 | tee node-test-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: node-test-output.txt
          if-no-files-found: error

      - name: Reprovar se houver falhas
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
