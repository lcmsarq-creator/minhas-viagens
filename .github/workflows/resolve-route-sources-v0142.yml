name: Resolve route sources v0142

on:
  push:
    branches:
      - feat/iconic-road-interactions-v0142
    paths:
      - '.github/workflows/resolve-route-sources-v0142.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Google Maps and routing sources
        shell: bash
        run: |
          set -e
          mkdir out
          curl -A 'Mozilla/5.0' -Ls -o /dev/null -w '%{url_effective}\n' 'https://goo.gl/maps/ATwdHEVMy8ZMJH4T6' > out/google-effective-url.txt || true
          curl -A 'Mozilla/5.0' -Ls 'https://caminhosdesaotiago.com.br/mapa/' > out/saotiago-map.html || true
          grep -Eoi 'https?://[^"<> ]+|[^"<> ]+\.gpx' out/saotiago-map.html | grep -Ei 'gpx|google|maps|drive' | head -100 > out/saotiago-links.txt || true
          curl -fsSL 'https://router.project-osrm.org/route/v1/driving/-46.57317399774923,-20.395664820555236;-46.6139660336841,-20.406878225530573?overview=full&geometries=geojson' > out/caminho-do-ceu.json
          curl -fsSL 'https://router.project-osrm.org/route/v1/driving/-46.569853819726454,-20.37843776657122;-46.57317399774923,-20.395664820555236?overview=full&geometries=geojson' > out/serra-branca.json
          curl -A 'MinhasViagens/0.14.2 route-review' -fsSL 'https://nominatim.openstreetmap.org/search?q=Trevo%20Caminhos%20de%20Pedra%2C%20Vila%20S%C3%A3o%20Marcos%2C%20Farroupilha%2C%20RS&format=jsonv2&limit=5' > out/caminhos-pedra-trevo.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-route-sources-v0142
          path: out
