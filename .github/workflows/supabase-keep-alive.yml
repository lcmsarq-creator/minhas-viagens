name: Manter Supabase ativo

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v5

      - name: Gerar atividade suficiente no Supabase
        shell: bash
        run: |
          set -euo pipefail

          SUPABASE_URL="$(sed -n 's/.*supabaseUrl: "\([^"]*\)".*/\1/p' config.js | head -n 1)"
          SUPABASE_KEY="$(sed -n 's/.*supabaseAnonKey: "\([^"]*\)".*/\1/p' config.js | head -n 1)"

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "Não foi possível ler a configuração pública do Supabase em config.js."
            exit 1
          fi

          for PING in 1 2 3 4 5 6; do
            echo "Keep-alive $PING/6"
            RESPONSE="$(curl               --fail-with-body               --silent               --show-error               --retry 2               --retry-all-errors               --retry-delay 5               --request POST               --header "apikey: $SUPABASE_KEY"               --header "Content-Type: application/json"               --header "User-Agent: minhas-viagens-keep-alive/1.1"               --data '{}'               "$SUPABASE_URL/rest/v1/rpc/keep_alive")"
            echo "Resposta: $RESPONSE"
            if [[ "$PING" -lt 6 ]]; then
              sleep 8
            fi
          done

          echo "Keep-alive diário concluído com 6 consultas ao banco."
