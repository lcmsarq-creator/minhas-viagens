      - name: Build hosted iconic catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_iconic_route_catalog.py
          mkdir -p /tmp/v0143-preview
          for f in bundle.json manifest.json caminho-da-agonia.json caminho-da-fe.json caminho-da-prece.json caminho-das-capelas.json caminho-de-nha-chica.json caminhos-de-caravaggio.json rota-da-luz-sp.json vale-europeu.json; do cp "iconic-route-catalog/v1/$f" "/tmp/v0143-preview/$f"; done
          git checkout HEAD -- iconic-route-catalog/v1
          cp /tmp/v0143-preview/* iconic-route-catalog/v1/
          rm -f iconic-route-catalog/v1/rota-do-vinho-sao-roque.json
      - name: Syntax and tests
        shell: bash
        run: |
          set -euo pipefail
          node --check v0142-adjustments.js
          node --check iconic-routes-catalog.js
          node --check iconic-route-catalog.js
          node --check auth.js
          node --check road-marker-hotfix.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ tests/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v0143-engineering.yml
          git add -A
          git commit -m 'feat: cidades separadas e rotas de peregrinação v0.14.3'
          git push origin HEAD:feat/city-tabs-pilgrimage-routes-v0143
