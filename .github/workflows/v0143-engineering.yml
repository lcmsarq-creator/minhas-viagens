name: v0143 engineering

on:
  push:
    branches:
      - feat/city-tabs-pilgrimage-routes-v0143
    paths:
      - '.github/workflows/v0143-engineering.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect route sources
        shell: bash
        run: |
          set -u
          rm -rf source-data
          mkdir -p source-data
          python3 - <<'PY'
          import requests, pathlib, re
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36'
          h={'User-Agent':UA,'accept-language':'en;q=0.9'}

          # User-provided public pages / redirects.
          urls={
            'vale-europeu':'https://valeeuropeucatarinense.com.br/circuito-caminhante/',
            'rota-luz':'https://goo.gl/maps/C6KCU1sVZP92',
          }
          for name,url in urls.items():
              try:
                  r=requests.get(url,headers=h,timeout=30,allow_redirects=True)
                  pathlib.Path(f'source-data/{name}.html').write_bytes(r.content)
                  pathlib.Path(f'source-data/{name}.meta.txt').write_text(f'status={r.status_code}\nfinal={r.url}\ncontent_type={r.headers.get("content-type")}\n',encoding='utf-8')
              except Exception as e:
                  pathlib.Path(f'source-data/{name}.meta.txt').write_text(repr(e),encoding='utf-8')

          # Google My Maps KML sources.
          for suffix,url in {
            'nha-chica-kml':'https://www.google.com/maps/d/kml?mid=15KU_ORnvmCQIg9lygaH6bcTWD2xxyDNq&forcekml=1',
            'rota-luz-kml':'https://www.google.com/maps/d/kml?mid=1yAdAynVO9-ns_OYPDsM0TRFSr38&forcekml=1',
          }.items():
              try:
                  r=requests.get(url,headers=h,timeout=30,allow_redirects=True)
                  pathlib.Path(f'source-data/{suffix}.kml').write_bytes(r.content)
                  pathlib.Path(f'source-data/{suffix}.meta.txt').write_text(f'status={r.status_code}\nfinal={r.url}\ncontent_type={r.headers.get("content-type")}\n',encoding='utf-8')
              except Exception as e:
                  pathlib.Path(f'source-data/{suffix}.meta.txt').write_text(repr(e),encoding='utf-8')

          # Official Vale Europeu GPX folder.
          try:
              u='https://drive.google.com/embeddedfolderview?id=1JVs2fPeBzyaQ1ATWOSYyhmvQcFez3gDk#grid'
              r=requests.get(u,headers=h,timeout=30,allow_redirects=True)
              pathlib.Path('source-data/vale-europeu-drive.html').write_bytes(r.content)
              pathlib.Path('source-data/vale-europeu-drive.meta.txt').write_text(f'status={r.status_code}\nfinal={r.url}\ncontent_type={r.headers.get("content-type")}\n',encoding='utf-8')
          except Exception as e:
              pathlib.Path('source-data/vale-europeu-drive.meta.txt').write_text(repr(e),encoding='utf-8')

          # Third-party open-source Wikiloc Earth service: returns public trail geometry as KML.
          # BBoxes are intentionally tight around each trail's start so the requested trail is among returned results.
          service='https://wikiloc-earth-layer.jonamat.cloud/api/v1/updates'
          bboxes={
            'caminho-fe':(-46.77,-21.98,-46.68,-21.91),
            'prece-1':(-46.64,-22.32,-46.57,-22.26),
            'prece-2':(-46.36,-22.34,-46.29,-22.28),
            'caravaggio':(-50.86,-29.39,-50.78,-29.33),
            'capelas':(-46.36,-22.34,-46.29,-22.28),
            'agonia':(-45.30,-22.25,-45.22,-22.18),
          }
          for name,(west,south,east,north) in bboxes.items():
              url=f'{service}?view={west},{south},{east},{north}'
              try:
                  r=requests.get(url,headers=h,timeout=90,allow_redirects=True)
                  pathlib.Path(f'source-data/{name}-earth.kml').write_bytes(r.content)
                  pathlib.Path(f'source-data/{name}-earth.meta.txt').write_text(f'status={r.status_code}\nfinal={r.url}\ncontent_type={r.headers.get("content-type")}\nbytes={len(r.content)}\n',encoding='utf-8')
              except Exception as e:
                  pathlib.Path(f'source-data/{name}-earth.meta.txt').write_text(repr(e),encoding='utf-8')
          PY
          tar -czf source-data/repo.tgz --exclude='.git' --exclude='source-data' .
      - uses: actions/upload-artifact@v4
        with:
          name: v0143-engineering-3
          path: source-data
