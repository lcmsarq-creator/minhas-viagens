name: publish v0143 candidate

on:
  push:
    branches:
      - feat/city-tabs-pilgrimage-routes-v0143
    paths:
      - '.github/workflows/v0143-engineering.yml'

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Load validated route sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src/final /tmp/src/alt /tmp/src/prece /tmp/v0143sources/vale
          get_artifact() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/lcmsarq-creator/minhas-viagens/actions/artifacts/$1/zip" -o "$2"
          }
          get_artifact 10575454298 /tmp/final.zip
          get_artifact 10576265041 /tmp/alt.zip
          get_artifact 10576545000 /tmp/prece.zip
          unzip -q /tmp/final.zip -d /tmp/src/final
          unzip -q /tmp/alt.zip -d /tmp/src/alt
          unzip -q /tmp/prece.zip -d /tmp/src/prece
          cp /tmp/src/alt/caminho-fe-alt0.html /tmp/v0143sources/caminho-fe.html
          cp /tmp/src/alt/caravaggio-alt0.html /tmp/v0143sources/caravaggio.html
          cp /tmp/src/alt/capelas-alt0.html /tmp/v0143sources/capelas.html
          cp /tmp/src/final/agonia-proxy.html /tmp/v0143sources/agonia.html
          cp /tmp/src/prece/prece-1-www.html /tmp/v0143sources/prece1.html
          cp /tmp/src/prece/prece-2-www.html /tmp/v0143sources/prece2.html
          cp /tmp/src/final/rota-luz-kml.kml /tmp/v0143sources/rota-luz.kml
          cp /tmp/src/final/nha-chica-kml.kml /tmp/v0143sources/nha-chica.kml
          cp /tmp/src/final/vale-gpx/*.gpx /tmp/v0143sources/vale/

      - name: Rebuild exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/v0143-payload-*.b64 | tr -d '\n ' | base64 -d | gzip -d > /tmp/apply_v0143.py
          echo '7c2099f5ccd88d9acbee4f598e67e679170cb61f477c1594d769f7c2ca6e59b0  /tmp/apply_v0143.py' | sha256sum -c -
          python3 -m py_compile /tmp/apply_v0143.py
          python3 /tmp/apply_v0143.py

      - name: Build hosted iconic catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_iconic_route_catalog.py
          mkdir -p /tmp/preview
          for f in bundle.json manifest.json caminho-da-agonia.json caminho-da-fe.json caminho-da-prece.json caminho-das-capelas.json caminho-de-nha-chica.json caminhos-de-caravaggio.json rota-da-luz-sp.json vale-europeu.json; do
            cp "iconic-route-catalog/v1/$f" "/tmp/preview/$f"
          done
          git checkout HEAD -- iconic-route-catalog/v1
          cp /tmp/preview/* iconic-route-catalog/v1/
          rm -f iconic-route-catalog/v1/rota-do-vinho-sao-roque.json

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check v0142-adjustments.js
          node --check iconic-routes-catalog.js
          node --check iconic-route-catalog.js
          node --check auth.js
          node --check road-marker-hotfix.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ tests/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .tmp .github/workflows/v0143-engineering.yml
          git add -A
          git commit -m 'feat: cidades separadas e rotas de peregrinação v0.14.3'
          git push origin HEAD:feat/city-tabs-pilgrimage-routes-v0143
