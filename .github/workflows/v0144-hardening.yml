name: harden v0144 crossings
on:
  push:
    branches:
      - fix/crossed-cities-iconic-v0144
    paths:
      - '.github/workflows/v0144-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden municipal identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crossing-detection-core.js')
          text = p.read_text()
          text = text.replace('![7,8,9].includes(level)', 'level !== 8')
          text = text.replace('if ((regionA && regionB) || (countryA && countryB)) return true;', 'if (regionA && regionB) return true;')
          p.write_text(text)

          p = Path('v0144-crossing-fix.js')
          text = p.read_text().replace('"admin_level"~"^(7|8|9)$"', '"admin_level"="8"')
          p.write_text(text)
          PY
          rm .github/workflows/v0144-hardening.yml
      - name: Validate
        run: |
          node --check crossing-detection-core.js
          node --check v0144-crossing-fix.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crossing-detection-core.js v0144-crossing-fix.js .github/workflows/v0144-hardening.yml
          git commit -m 'fix: restringir cidades cruzadas a municípios confiáveis'
          git push origin HEAD:fix/crossed-cities-iconic-v0144
