name: integrate v0144 crossings
on:
  push:
    branches:
      - fix/crossed-cities-iconic-v0144
    paths:
      - '.github/workflows/v0144-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate load order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('auth.js')
          text = p.read_text()
          old = '"iconic-catalog-preview-hotfix.js","v0142-adjustments.js"'
          new = '"iconic-catalog-preview-hotfix.js","v0142-adjustments.js","crossing-detection-core.js","v0144-crossing-fix.js"'
          if old not in text:
              raise SystemExit('load-order anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/v0144-integrate.yml
      - name: Validate integrated app
        run: |
          node --check crossing-detection-core.js
          node --check v0144-crossing-fix.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth.js .github/workflows/v0144-integrate.yml
          git commit -m 'feat: carregar correções de cruzamentos v0.14.4'
          git push origin HEAD:fix/crossed-cities-iconic-v0144
