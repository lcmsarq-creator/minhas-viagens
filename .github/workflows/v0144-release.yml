name: prepare v0144 release
on:
  push:
    branches:
      - fix/crossed-cities-iconic-v0144
    paths:
      - '.github/workflows/v0144-release.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and clean temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','auth.js','v0142-adjustments.js','iconic-routes.js','iconic-catalog-preview-hotfix.js']:
              p=Path(name)
              text=p.read_text()
              p.write_text(text.replace('0.14.3','0.14.4'))
          for p in Path('tests').glob('*.test.js'):
              text=p.read_text()
              text=text.replace('0.14.3','0.14.4').replace('0\\.14\\.3','0\\.14\\.4')
              p.write_text(text)
          PY
          rm -f .github/workflows/v0144-tests.yml
          rm .github/workflows/v0144-release.yml
      - name: Validate final candidate
        run: |
          node --check crossing-detection-core.js
          node --check v0144-crossing-fix.js
          node --check auth.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit final candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: preparar v0.14.4 com cruzamentos corrigidos'
          git push origin HEAD:fix/crossed-cities-iconic-v0144
