name: validate v0144 crossings
on:
  push:
    branches:
      - fix/crossed-cities-iconic-v0144
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check crossing-detection-core.js
          node --check v0144-crossing-fix.js
      - name: Crossing tests
        run: node --test tests/v0144-crossing-detection.test.js
      - name: Full Node suite
        run: node --test tests/*.test.js
      - name: Python suite
        run: python -m unittest discover -s tests -p 'test_*.py'
