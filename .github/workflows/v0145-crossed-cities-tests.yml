name: validate v0145 crossed cities
on:
  push:
    branches:
      - fix/crossed-cities-v0145
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate focused crossed-city logic
        run: |
          node --check v0145-crossed-cities.js
          node --check auth.js
          node --test tests/v0145-crossed-cities.test.js
          node --test tests/v0144-crossing-detection.test.js
