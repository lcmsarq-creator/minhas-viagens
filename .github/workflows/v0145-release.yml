name: prepare v0145 crossed cities release
on:
  push:
    branches:
      - fix/crossed-cities-v0145
    paths:
      - '.github/workflows/v0145-release.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump release and clean temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = list(Path('.').glob('*.js')) + [Path('index.html')] + list(Path('tests').glob('*.test.js'))
          for p in roots:
              if not p.exists():
                  continue
              text = p.read_text()
              if '0.14.4' in text:
                  p.write_text(text.replace('0.14.4','0.14.5'))
          PY
          rm -f .github/workflows/v0145-crossed-cities-tests.yml
          rm .github/workflows/v0145-release.yml
      - name: Validate final candidate
        run: |
          node --check v0145-crossed-cities.js
          node --check v0144-crossing-fix.js
          node --check crossing-detection-core.js
          node --check auth.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit final candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: preparar v0.14.5 com cidades cruzadas corrigidas'
          git push origin HEAD:fix/crossed-cities-v0145
