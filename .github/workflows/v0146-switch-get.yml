name: switch v0146 overpass to get
on:
  push:
    branches:
      - fix/crossed-cities-v0146
    paths:
      - '.github/workflows/v0146-switch-get.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch runtime and integration test to GET
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('v0146-crossed-cities-runtime.js')
          text = p.read_text()
          old = '''        const response = await fetch(endpoint, {
          method: "POST",
          headers: {"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
          body: `data=${encodeURIComponent(query)}`,
          signal: controller.signal
        });'''
          new = '''        const response = await fetch(`${endpoint}?data=${encodeURIComponent(query)}`, {
          headers: {"Accept":"application/json"},
          signal: controller.signal
        });'''
          if old not in text:
              raise SystemExit('runtime POST block not found')
          p.write_text(text.replace(old, new))

          w = Path('.github/workflows/v0146-tests.yml')
          text = w.read_text()
          old = '''              const response = await fetch(endpoint, {
                method:'POST',
                headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                body:`data=${encodeURIComponent(q)}`,
                signal:controller.signal
              });'''
          new = '''              const response = await fetch(`${endpoint}?data=${encodeURIComponent(q)}`, {
                headers:{'Accept':'application/json','User-Agent':'minhas-viagens-ci/0.14.6'},
                signal:controller.signal
              });'''
          if old not in text:
              raise SystemExit('workflow POST block not found')
          w.write_text(text.replace(old, new))
          PY
          rm .github/workflows/v0146-switch-get.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: usar GET simples nas consultas Overpass'
          git push origin HEAD:fix/crossed-cities-v0146
