name: validate v0146 crossed cities
on:
  push:
    branches:
      - fix/crossed-cities-v0146
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused tests
        run: |
          node --check v0146-crossed-cities-runtime.js
          node --test tests/v0146-crossed-cities-runtime.test.js
      - name: Validate Overpass query against real service
        run: |
          node <<'NODE'
          const endpoints = [
            'https://overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter',
            'https://overpass.private.coffee/api/interpreter'
          ];
          const q='[out:json][timeout:14];(node["place"~"^(city|town|village)$"](-20.90,-49.50,-20.70,-49.20);way["place"~"^(city|town|village)$"](-20.90,-49.50,-20.70,-49.20);relation["place"~"^(city|town|village)$"](-20.90,-49.50,-20.70,-49.20););out body center;';
          let last;
          for (const endpoint of endpoints) {
            try {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 20000);
              const response = await fetch(endpoint, {
                method:'POST',
                headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                body:`data=${encodeURIComponent(q)}`,
                signal:controller.signal
              });
              clearTimeout(timer);
              if (!response.ok) throw new Error(`${endpoint} HTTP ${response.status}`);
              const data = await response.json();
              const places = (data.elements || []).filter(x => /^(city|town|village)$/.test(x.tags?.place || ''));
              if (!places.length) throw new Error(`${endpoint} respondeu sem localidades`);
              console.log(`Overpass válido: ${endpoint} retornou ${places.length} localidades`);
              process.exit(0);
            } catch (error) { last = error; console.warn(String(error)); }
          }
          throw last || new Error('Nenhum endpoint Overpass validou a consulta');
          NODE
      - name: Full test suite
        run: |
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
