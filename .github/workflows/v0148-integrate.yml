name: integrate local AR UY city scanner

on:
  workflow_dispatch:
  push:
    branches:
      - feat/local-cities-ar-uy-v0148
    paths:
      - scripts/apply-v0148.py
      - tests/v0148-local-cities-ar-uy.test.js

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.14.8 integration
        run: python scripts/apply-v0148.py
      - name: Validate syntax and behavior
        run: |
          node --check v0147-crossed-cities-local.js
          node --check auth.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate catalog footprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('city-catalog/v1/manifest.json').read_text())
          total=sum(item['bytes'] for item in m['countries'].values())
          print(f"AR+UY runtime catalog bytes: {total}")
          assert total < 1100000
          assert m['countries']['AR']['count'] > 10000
          assert m['countries']['UY']['count'] > 500
          PY
      - name: Commit candidate
        run: |
          rm scripts/apply-v0148.py
          rm .github/workflows/v0148-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: cidades locais de Argentina e Uruguai v0.14.8'
          git push origin HEAD:feat/local-cities-ar-uy-v0148
