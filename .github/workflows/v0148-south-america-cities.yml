name: validate South America city catalogs v0.14.8

on:
  push:
    branches:
      - feat/local-cities-ar-uy-v0148

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build filtered city catalogs
        run: python scripts/build-city-catalog.py
      - name: Apply runtime integration
        run: python scripts/apply-v0148-sa.py
      - name: Validate candidate
        run: |
          node --check v0147-crossed-cities-local.js
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Report catalog footprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('city-catalog/v1/manifest.json').read_text())
          total=0
          for code,item in m['countries'].items():
              total += item['bytes']
              print(f"{code}: {item['count']} entries, {item['bytes']} bytes")
          print(f"TOTAL: {total} bytes")
          assert len(m['countries']) == 9
          assert total < 3000000
          assert m['countries']['AR']['count'] < 5000
          PY
      - name: Commit candidate
        run: |
          rm scripts/apply-v0148-sa.py
          rm .github/workflows/v0148-south-america-cities.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: catálogos locais sul-americanos v0.14.8'
          git push origin HEAD:feat/local-cities-ar-uy-v0148
